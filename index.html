<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recommendation Letters</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; color: #222; background: #fff; }
  h1 { font-size: 1.4rem; }
  a.prof { display: block; padding: 14px 16px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; text-decoration: none; color: inherit; font-size: 1.1rem; }
  a.prof:hover { background: #f4f4f4; }
  a.prof span { float: right; color: #666; font-size: .9rem; }
  label { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
  input[type=checkbox] { width: 20px; height: 20px; }
  button { margin-top: 16px; padding: 10px 24px; font-size: 1rem; cursor: pointer; }
  #status { margin-left: 12px; color: #666; }
  .back { color: #06c; }
</style>
</head>
<body>
<div id="app">Loading…</div>
<script>
// Paste your Firebase Realtime Database URL here (no trailing slash).
const DB = "https://job-applications-d7ee3-default-rtdb.firebaseio.com";

const PROFESSORS = {
  "indrajit-ray": "Prof. Indrajit Ray",
  "indrakshi-ray": "Prof. Indrakshi Ray",
  "sudipto-ghosh": "Prof. Sudipto Ghosh",
  "sarath-sreedharan": "Dr. Sarath Sreedharan",
};

// Add a school: add one line. Key = short id (never change it once used),
// then display name and which recommenders are listed in that school's References.pdf.
const ALL4 = ["indrajit-ray", "indrakshi-ray", "sudipto-ghosh", "sarath-sreedharan"];
const GHOSH = ["indrajit-ray", "indrakshi-ray", "sudipto-ghosh"];
const SREE = ["indrajit-ray", "indrakshi-ray", "sarath-sreedharan"];
const SCHOOLS = {
  "alabama": ["The University of Alabama", ALL4],
  "alcorn": ["Alcorn State University", GHOSH],
  "athens": ["Athens State University", GHOSH],
  "calpoly-pomona": ["California State Polytechnic University, Pomona", ALL4],
  "csulb": ["California State University, Long Beach", GHOSH],
  "hofstra": ["Hofstra University", GHOSH],
  "ksu": ["Kennesaw State University", GHOSH],
  "montana-state": ["Montana State University", ALL4], // no References.pdf in folder
  "mst": ["Missouri University of Science and Technology (Computer Science)", SREE],
  "mst-ce": ["Missouri University of Science and Technology (Electrical and Computer Engineering)", GHOSH],
  "nku-cit": ["Northern Kentucky University (CIT Cybersecurity)", SREE],
  "nku-isa": ["Northern Kentucky University (Information Systems)", GHOSH],
  "sdsu": ["San Diego State University", GHOSH],
  "siue": ["Southern Illinois University Edwardsville", ALL4], // no References.pdf in folder
  "sjsu": ["San José State University", GHOSH],
  "ucdenver": ["University of Colorado Denver", SREE],
  "um-flint": ["University of Michigan-Flint", SREE],
  "unm": ["The University of New Mexico", ALL4],
  "utep": ["The University of Texas at El Paso", GHOSH],
  "yeshiva": ["Yeshiva University", SREE],
};

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const schoolsFor = id => Object.keys(SCHOOLS).filter(k => SCHOOLS[k][1].includes(id))
  .sort((a, b) => SCHOOLS[a][0].localeCompare(SCHOOLS[b][0]));

async function get(path) {
  const r = await fetch(`${DB}/${path}.json`);
  if (!r.ok) throw new Error(r.status);
  return (await r.json()) || {};
}

async function home() {
  const all = await get("letters");
  app.innerHTML = `<h1>Recommendation Letters</h1><p>Select your name.</p>` +
    Object.entries(PROFESSORS).map(([id, name]) =>
      `<a class="prof" href="#${id}">${esc(name)}<span>${schoolsFor(id).filter(k => all[id] && all[id][k]).length} / ${schoolsFor(id).length} sent</span></a>`).join("");
}

async function prof(id) {
  const [data, saved] = await Promise.all([get(`letters/${id}`), get(`savedAt/${id}`)]);
  app.innerHTML = `<p><a class="back" href="#">← All recommenders</a></p>
    <h1>${esc(PROFESSORS[id])}</h1>
    <p>Check each school where you have submitted the letter, then click Save.</p>
    <form id="f">` +
    schoolsFor(id).map(k =>
      `<label><input type="checkbox" name="${k}" ${data[k] ? "checked" : ""}> ${esc(SCHOOLS[k][0])}</label>`).join("") +
    `<button>Save</button><span id="status">${typeof saved === "number" ? "Last saved " + new Date(saved).toLocaleString() : ""}</span></form>`;

  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const status = document.getElementById("status");
    const body = {};
    for (const k of schoolsFor(id)) body[`letters/${id}/${k}`] = e.target.elements[k].checked;
    body[`savedAt/${id}`] = Date.now();
    status.textContent = "Saving…";
    try {
      const r = await fetch(`${DB}/.json`, { method: "PATCH", body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.status);
      status.textContent = "Saved ✓ " + new Date().toLocaleString();
    } catch (err) {
      status.textContent = "Save failed — please try again (" + err.message + ")";
    }
  };
}

async function route() {
  const id = location.hash.slice(1);
  app.textContent = "Loading…";
  try {
    PROFESSORS[id] ? await prof(id) : await home();
  } catch (err) {
    app.textContent = "Could not load data (" + err.message + "). Please refresh.";
  }
}
window.onhashchange = route;
route();
</script>
</body>
</html>
